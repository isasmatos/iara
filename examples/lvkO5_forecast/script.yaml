# Example: LVK O5 forecast cross-correlated with simulated galaxies (parameters of the code at commit e559b71)
#
# Run from this folder (storage = "." is the folder iara is run from):
#   cd examples/lvkO5_forecast
#   mpirun -np 8 iara --run script.yaml
#
# Pipeline: matter Cls -> galaxy simulations -> forecast GW maps -> pseudo-Cls -> MCMC.
# The outputs are stored in script_output/.
# Optional parameters that are not listed take their default values (see docs/parameters.rst)

# Which steps to perform
"compute_matter_cls" : True
"simulate_galaxies" : True
"simulate_gws" : True
"compute_cls" : True
"mcmc" : True

# Parameters of the simulations
"nside": 64
"lmax": 191 # max multipole of the matter Cls (up to 3*nside-1)
"bin_edges": [0.0, 0.06, 0.12, 0.18, 0.24, 0.3, 0.36, 0.42, 0.48, 0.54, 0.6] # list or .npy file with list
"N_sim": 5000 # Number of simulations
"N_samples": 1000 # N of samples for GW position posterior
"corr": null # Number of correlated matter shells (null = all shells are correlated)
"bs" : 5 # bin size for the multipole bins
"bgw" : 1 # if different from 1, a second set of galaxy "host" catalogs will be generated
"include_lensing" : False # True also saves the convergence maps of the galaxy simulations, used in the GW distances

# Fiducial cosmology
"H0": 67.36
"omch2": 0.1200
"ombh2": 0.02237
"As": 2.100e-9
"ns": 0.9649
"tau": 0.0544

# Parameters of forecasts
"forecast" : True # forecast catalog for the GWs, and Fisher covariance in the likelihood
"detector_forecast": "/inputs/lvkO5.txt" # forecast catalog (relative to storage), with columns z Dl ra dec err_Dl err_area90
"forecast_distance_unit": "Gpc" # unit of Dl and err_Dl in lvkO5.txt
"forecast_sky_selection": "ra_averaged" # the ra of the catalog is an Earth-fixed azimuth: only declinations are used

# Set paths of simulations (relative to storage)
"storage": "." # the folder iara is run from
"matter_cls": "/script_output/matter_cls" # path to matter cls
"gdir": "/script_output/galaxies" # path to galaxy simulations
"bdir": "/script_output/gws" # path to GW simulations
"cls_dir": "/script_output/cls" # path to cls

# Galaxy survey: Smail distribution over the full sky (no dndz file, selection function or photo-z's)
"smail": [0.7, 0.8, 2.0, 6.0e+7] # (z_mode, alpha, beta, Ngal) of the Smail distribution
"mask": null # null = simple galactic cut in the pseudo-Cls

# Parameters of the likelihood and MCMC
# The forecast likelihood uses the mean Cls of the simulations both as theory and as data.
"cls_theory_dir": "/script_output/cls" # mean Cls used as theory (relative to storage)
"cls_data_dir": "/script_output/cls" # mean Cls used as data (relative to storage)
"galaxy_map_type": "contrast" # galaxy maps used in the Cls: "contrast" or "counts"
"cut_bins": [0, 0, 0] # number of likelihood bins removed: [low distance, high distance, high redshift]
"coarse_bin": 1 # number of simulation bins combined in each likelihood bin
"lbins": [1, 20] # first and last+1 multipole bands used (bands of size bs from ell = 2)
"priors": # uniform priors; parameters not listed are fixed at their fiducial values (w0 = -1, wa = 0 by default)
  "H0": [20, 140]
  "OM": [0.1, 0.5]
  "bgw": [0.0, 10.0]
  # "w0": [-2.0, 0.0] # uncomment to vary w0
  # "wa": [-3.0, 2.0] # uncomment to vary wa (w0 + wa >= 0 is always excluded)
"chains_path": "/script_output/chains/lvkO5.h5" # MCMC chains (relative to storage)
"mcmc_steps": 5000 # number of steps of each walker
"mcmc_walkers": 6 # number of walkers
